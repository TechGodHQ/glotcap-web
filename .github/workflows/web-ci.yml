name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-build:
    name: Web quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Public frontend configuration; no backend deployment or provider credentials.
      VITE_CONVEX_URL: https://proficient-kudu-295.convex.cloud
      NITRO_PRESET: node-server
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.2.7'
      - name: Install locked dependencies and bundled workspaces
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check formatting, lint, types, and unit tests
        run: bun run quality:ci
      - name: Build web server
        run: bun run build
      - name: Build container
        run: docker build --build-arg VITE_CONVEX_URL="$VITE_CONVEX_URL" --tag glotcap-web:ci .
      - name: Smoke-test container health
        shell: bash
        run: |
          container=$(docker run --detach --health-interval=2s --health-start-period=5s glotcap-web:ci)
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 60 seconds.' >&2
          exit 1
